# Menu personnalisé : touche F6 dans Ventoy

menuentry "Paramètres UEFI / BIOS" --class=tools {
    fwsetup
}

menuentry "Redémarrer" --class=power {
    echo "Redémarrage..."
    reboot
}

menuentry "Éteindre" --class=power {
    echo "Arrêt..."
    halt
}

menuentry "<-- Retour au menu principal" --class=vtoyret VTOY_RET {
    echo "Retour..."
}
